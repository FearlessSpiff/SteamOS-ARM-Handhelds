# SM8250 (865) handhelds: no camera monitoring in WirePlumber.
#
# The video codec (qcom-iris, /dev/video0 and /dev/video1) cannot load its
# firmware here, so opening it fails ("Cannot open '/dev/video0': Cannot
# allocate memory"). The v4l2 monitor hook never finishes after that and
# WirePlumber's event queue stops: no client ever gets its permissions, so
# PulseAudio clients (Steam, pactl) connect but are never answered, Steam
# sees "no audio devices" and takes minutes to start.
wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
    monitor.libcamera = disabled
  }
}
