# Use case configuration for AYN SM8750
# Author: Teguh Sobirin <teguh@sobir.in>

SectionVerb {
	EnableSequence [
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	Include.wcde.File "/codecs/wcd939x/DefaultEnableSeq.conf"

	# DisplayPort route, only with a kernel and topology that have the
	# DISPLAY_PORT_RX_0 backend (not the prebuilt ROCKNIX ones). Routed at
	# verb level like the others: PipeWire opens every PCM while probing
	# the profile, and one without a backend fails the whole profile.
	If.dp {
		Condition {
			Type ControlExists
			Control "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia4'"
		}
		True.EnableSequence [
			cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia4' 1"
		]
	}

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones playback"

	# rx-macro routing first, then the PCM mode flags, then the wcd939x
	# bring-up: the HPH and COMP switches connect their SoundWire ports
	# when set, so the mode has to be in place before they come up.
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"

	EnableSequence [
		cset "name='HPH PCM Switch' 1"
		cset "name='RX_HPH PCM Switch' 1"
	]

	Include.wcdhpe.File "/codecs/wcd939x/HeadphoneEnableSeq.conf"

	Include.wcdhpd.File "/codecs/wcd939x/HeadphoneDisableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	DisableSequence [
		cset "name='HPH PCM Switch' 0"
		cset "name='RX_HPH PCM Switch' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "HP Digital"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

# DisplayPort audio over USB-C, on its own frontend (MultiMedia4, PCM 3).
If.dp {
	Condition {
		Type ControlExists
		Control "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia4'"
	}
	True.SectionDevice."DisplayPort" {
		Comment "DisplayPort playback"

		Value {
			PlaybackChannels 2
			PlaybackPriority 150
			PlaybackPCM "hw:${CardId},3"
			JackControl "DP0 Jack"
		}
	}
}
